name: Build and test

on:
  push:
    branches: [publish-v0.1.0]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ 'refs/tags/v0.1.0' }}
      - run: cargo fmt --check
      - run: cargo test --locked

  windows:
    runs-on: windows-2025
    env:
      SOURCE_DIRECTORY: ${{ 'tagged-source' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.1.0
          path: tagged-source
          persist-credentials: false
      - run: cargo test --locked
        working-directory: ${{ env.SOURCE_DIRECTORY }}
      - run: cargo build --release --locked
        working-directory: ${{ env.SOURCE_DIRECTORY }}
      - name: Package and test Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SourceDirectory $env:SOURCE_DIRECTORY
      - uses: actions/upload-artifact@v4
        with:
          name: Floating-Tray-Windows-x64
          path: |
            dist/Floating-Tray-Setup-x64.exe
            dist/Floating-Tray-Windows-x64.zip
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/publish-v0.1.0'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-v0.1.0
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Floating-Tray-Windows-x64
          path: dist
      - run: bash scripts/publish-release.sh "$RELEASE_TAG" dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.0
