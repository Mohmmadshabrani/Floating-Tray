[package]
name = "floating-tray"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A floating, pinnable Windows notification-area dock"
license = "MIT"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_LibraryLoader",
    "Win32_System_Pipes", "Win32_System_Threading",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
